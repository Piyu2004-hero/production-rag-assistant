services:

  api:

    build: .

    container_name: rag-api

    ports:
      - "8000:8000"

    env_file:
      - .env

    volumes:
      - rag_data:/app/data


  ui:

    build: .

    container_name: rag-ui

    command:
      streamlit run streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501

    ports:
      - "8501:8501"

    environment:
      API_URL: http://api:8000

    env_file:
      - .env

    volumes:
      - rag_data:/app/data

    depends_on:
      - api


volumes:

  rag_data:
